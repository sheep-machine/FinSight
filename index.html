<!DOCTYPE html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

            color: #e0e6ed;

        .container { max-width: 720px; padding: 40px; text-align: center; }

            text-decoration: none;
            color: #e0e6ed;
            transition: all 0.3s ease;
        }
        .link-card:hover {
            background: rgba(0,245,212,0.08);
            border-color: rgba(0,245,212,0.3);
            transform: translateY(-2px);
        }
        .link-card .title { font-size: 1.15em; font-weight: 600; margin-bottom: 4px; }
        .link-card .desc { font-size: 0.85em; color: #8892b0; }
        .footer { margin-top: 40px; font-size: 0.8em; color: #4a5568; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            background: rgba(0,245,212,0.15);
            border: 1px solid rgba(0,245,212,0.3);
            border-radius: 20px;
            font-size: 0.75em;
